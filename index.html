<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datacenter Live NOC</title>
    <!-- Εισαγωγή της βιβλιοθήκης Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Σκοτεινό θέμα (Dark Mode) */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ffcc; /* Μια νέον πράσινη/μπλε απόχρωση */
            margin-bottom: 40px;
        }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }
        .chart-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 45%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        /* Προσαρμογή για κινητά */
        @media (max-width: 768px) {
            .chart-container { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Datacenter Live Monitor</h1>

    <div class="dashboard">
        <!-- Περιοχή για το Γράφημα Θερμοκρασίας -->
        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>
        <!-- Περιοχή για το Γράφημα CPU -->
        <div class="chart-container">
            <canvas id="cpuChart"></canvas>
        </div>
    </div>

    <script>
        // Ρύθμιση του γραφήματος Θερμοκρασίας (Μπάρες)
        const tempCtx = document.getElementById('tempChart').getContext('2d');
        let tempChart = new Chart(tempCtx, {
            type: 'bar',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Θερμοκρασία (°C)', 
                    data: [], 
                    backgroundColor: 'rgba(255, 99, 132, 0.8)',
                    borderRadius: 4
                }] 
            },
            options: { 
                responsive: true, 
                scales: { y: { beginAtZero: true, max: 100 } },
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });

        // Ρύθμιση του γραφήματος CPU (Γραμμή/Κύμα)
        const cpuCtx = document.getElementById('cpuChart').getContext('2d');
        let cpuChart = new Chart(cpuCtx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Χρήση CPU (%)', 
                    data: [], 
                    borderColor: 'rgba(54, 162, 235, 1)', 
                    backgroundColor: 'rgba(54, 162, 235, 0.2)', 
                    fill: true,
                    tension: 0.4 // Κάνει τη γραμμή καμπυλωτή
                }] 
            },
            options: { 
                responsive: true, 
                scales: { y: { beginAtZero: true, max: 100 } },
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });

        // Συνάρτηση που τραβάει τα δεδομένα και ανανεώνει τα γραφήματα
        // Συνάρτηση που τραβάει τα δεδομένα και ανανεώνει τα γραφήματα
        async function fetchLiveMetrics() {
            try {
                // Βάλαμε την κάθετο στο τέλος: /servers/
                const response = await fetch('/servers/');
                const data = await response.json();

                // Αλλάξαμε το server.name σε server.rack_name
                const serverNames = data.map(server => server.rack_name);
                const temperatures = data.map(server => server.temperature);
                const cpus = data.map(server => server.cpu_usage);

                // Ενημέρωση γραφήματος θερμοκρασίας
                tempChart.data.labels = serverNames;
                tempChart.data.datasets[0].data = temperatures;
                tempChart.update();

                // Ενημέρωση γραφήματος CPU
                cpuChart.data.labels = serverNames;
                cpuChart.data.datasets[0].data = cpus;
                cpuChart.update();

            } catch (error) {
                console.error("Σφάλμα σύνδεσης με το API:", error);
            }
        }

        // Φόρτωσε τα δεδομένα αμέσως και μετά κάθε 5 δευτερόλεπτα (5000ms)
        fetchLiveMetrics();
        setInterval(fetchLiveMetrics, 5000);
    </script>
</body>
</html>
